[project]
name = "clawgeneer"
version = "0.1.0"
description = "Open-source engineering orchestration platform"
requires-python = ">=3.11"
# Not for pip install — run from repo with bootstrap.sh venv

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "S102", "S603"]
